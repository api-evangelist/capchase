aid: capchase
name: Capchase
description: >-
  Capchase provides embedded financing and B2B payment infrastructure for software
  and hardware vendors. Its Capchase Pay API lets vendors offer buyers flexible
  installment payment terms at checkout while the vendor is paid the full contract
  value upfront. Vendors create buyer companies, run automated KYB/underwriting
  qualification, create subscriptions that generate hosted payment links, list and
  retrieve subscription status, and pull instalment receipts. The v2 REST API is
  served from universe.capchase.com, uses HTTP Basic authentication (clientId /
  clientSecret), ships a Playground environment, and is documented on a ReadMe
  developer portal with an OpenAPI reference and an AI-agent llms.txt index. Sector:
  fintech; backed by QED Investors.
